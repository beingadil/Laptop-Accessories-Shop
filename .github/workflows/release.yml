name: Release

# Triggered only by a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
# The job re-runs the full gate, packages the Windows installer, and publishes
# it (plus update metadata latest.yml) as a GitHub Release — automatically
# eligible for electron-updater consumption by installed apps.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Windows installer + GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches package.json version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "Tag v$tag does not match package.json version $pkg"
            exit 1
          }
          Write-Host "Release version OK: $pkg"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 26 (with pnpm store cache)
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Release gate — lint, typecheck, tests, build
        # NOTE: `pnpm ci` is pnpm's built-in frozen install (NOT our script) —
        # use `pnpm run ci` or the gate silently does nothing and .next/standalone
        # never gets built (this is what produced the broken v1.0.1 installer).
        run: pnpm run ci

      - name: Verify standalone output exists before packaging
        shell: pwsh
        run: |
          if (-not (Test-Path .next/standalone/server.js)) {
            throw "Release gate failed: .next/standalone/server.js is missing — refusing to package an installer without the embedded server."
          }
          Write-Host "standalone/server.js present — packaging will produce a working app."

      - name: Build Windows installer
        run: pnpm exec electron-builder --win --config electron-builder.json --publish never

      # electron-builder's own publisher was creating duplicate releases for the
      # same tag and splitting the assets between them; publish once, here instead.
      - name: Publish GitHub Release with all installer assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist-electron/Tayyab-Enterprises-Management-System-Setup-*.exe
            dist-electron/Tayyab-Enterprises-Management-System-Setup-*.exe.blockmap
            dist-electron/latest.yml
          generate_release_notes: true
